<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <main>
      <div class="container my-5">
        <div class="text-center mb-4">
        <h2 class="text-success fw-bold">Seller Dashboard</h2>
        <p class="text-muted">Enter the details of the product you want to sell.</p>
        </div>
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Add your product</h4>
            </div>
        <div class="card-body p-4">
        <form id="productForm">
          <div class="mb-3">
            <label for="productName">Product Name:</label><br>
            <input type="text" id="productName" 
            placeholder="e.g Fresh tomatoes" required><br><br>
            <label for="category">Product Category</label><br>
    <select id="category" required>
    <option value="">Choose category</option>
    <option value="Vegetables">Vegetables</option>
      <option value="Fruits">Fruits</option>
      <option value="Grains">Grains</option>
     <option value="Legumes">Legumes</option>
      <option value="Other">Other</option>
      </select><br><br>
          </div>
<div class="row">
      <div class="col mb-3">
  <label for="quantity">Quantity</label><br>
 <input type="number" id="quantity"
      min="0.01" step="any"
    placeholder="e.g. 20" required><br><br>
    </div>
<div class="col mb-3">
    <label for="unit">Unit</label><br>
    <select id="unit" required>
       <option value="kg">Kilograms</option>
      <option value="bags">Bags</option>
   <option value="crates">Crates</option>
    <option value="bunches">Bunches</option>
    <option value="pieces">Pieces</option>
  </select><br><br>
</div>
<div class="mb-3">
   <label for="price">Price (UGX)</label><br>
   <input type="number" id="price"
    min="1" step="1"
   placeholder="e.g. 2000" required><br><br>
</div>
<div class="mb-3">
   <label for="location">Location</label><br>
   <input type="text" id="location"
                   placeholder="e.g. Mukono" required><br><br>
</div>
<div class="mb-3">
<label for="description">Product Description</label><br>
 <textarea id="description" rows="4"
                      placeholder="Describe your product"></textarea>
</div>
<div class="mb-3">
 <button type="submit">Submit Product</button>
</div>
  <p id="message"></p>

  </form>
      </div>
      </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
